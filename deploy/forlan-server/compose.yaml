name: forlan-destek-server

services:
  hbbs:
    image: rustdesk/rustdesk-server@sha256:8ecdab65deb7c84652a626380e31d11a8f1fbafd97916d57f95c20628f943c00
    container_name: forlan-hbbs
    command: hbbs -r 95.70.196.174:21117
    restart: unless-stopped
    depends_on:
      - hbbr
    ports:
      - "21115:21115/tcp"
      - "21116:21116/tcp"
      - "21116:21116/udp"
    volumes:
      - forlan_server_data:/root

  hbbr:
    image: rustdesk/rustdesk-server@sha256:8ecdab65deb7c84652a626380e31d11a8f1fbafd97916d57f95c20628f943c00
    container_name: forlan-hbbr
    command: hbbr -k _
    restart: unless-stopped
    ports:
      - "21117:21117/tcp"
    volumes:
      - forlan_server_data:/root

volumes:
  forlan_server_data:
    name: forlan_server_data
